<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menti Join</title>
<meta name="description" content="A tiny Mac menu bar app that joins the Menti on your screen in one click.">
<meta property="og:title" content="Menti Join">
<meta property="og:description" content="A tiny Mac menu bar app that joins the Menti on your screen in one click.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
  :root {
    --bar-h: 30px;
    --bar-text: #fff;
    --pop-bg: rgba(246, 246, 248, 0.88);
    --pop-border: rgba(0, 0, 0, 0.12);
    --pop-text: #1d1d1f;
    --pop-secondary: rgba(0, 0, 0, 0.5);
    --pop-divider: rgba(0, 0, 0, 0.1);
    --btn-bg: #fff;
    --btn-border: rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --pop-bg: rgba(40, 40, 46, 0.86);
      --pop-border: rgba(255, 255, 255, 0.14);
      --pop-text: #f5f5f7;
      --pop-secondary: rgba(255, 255, 255, 0.55);
      --pop-divider: rgba(255, 255, 255, 0.12);
      --btn-bg: rgba(255, 255, 255, 0.16);
      --btn-border: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    background-color: #12153a;
    background-image:
      radial-gradient(60vmax 55vmax at 92% 105%, rgba(255, 112, 112, 0.85), transparent 62%),
      radial-gradient(70vmax 60vmax at 8% -10%, rgba(90, 110, 235, 0.95), transparent 60%),
      radial-gradient(50vmax 45vmax at 55% 60%, rgba(140, 90, 220, 0.45), transparent 65%),
      linear-gradient(160deg, #1b2160 0%, #12153a 55%, #2a1638 100%);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Menu bar ---------- */
  .menubar {
    position: fixed; inset: 0 0 auto 0; height: var(--bar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    background: rgba(10, 12, 40, 0.28);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    backdrop-filter: blur(24px) saturate(160%);
    color: var(--bar-text);
    font-size: 14px; letter-spacing: -0.01em;
    user-select: none; z-index: 10;
  }
  .menubar .left, .menubar .right { display: flex; align-items: center; height: 100%; }
  .menubar .left span { padding: 0 9px; opacity: 0.95; }
  .menubar .left .app { font-weight: 700; }
  .menubar .right > * { display: flex; align-items: center; height: calc(var(--bar-h) - 6px); padding: 0 8px; }
  .status-anchor { position: relative; }
  .status-item {
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.24);
  }
  .status-icon {
    width: 18px; height: 18px; background: #fff;
    -webkit-mask: url(assets/menubar-icon.png) center / contain no-repeat;
    mask: url(assets/menubar-icon.png) center / contain no-repeat;
  }
  .menubar svg { display: block; }
  .clock { font-variant-numeric: tabular-nums; }

  /* ---------- Popover ---------- */
  .popover {
    position: absolute; top: calc(100% + 12px); left: 50%;
    width: 330px;
    transform: translateX(calc(-50% + var(--shift, 0px)));
    color: var(--pop-text);
    background: var(--pop-bg);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border: 0.5px solid var(--pop-border);
    border-radius: 12px;
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.38), 0 4px 14px rgba(0, 0, 0, 0.18);
    padding: 14px;
    font-size: 13px; line-height: 1.35;
    animation: pop-in 0.5s cubic-bezier(.2,.9,.3,1.2) 0.25s both;
    transform-origin: 50% 0;
  }
  .popover::before { /* arrow */
    content: ""; position: absolute; top: -8px;
    left: calc(50% - var(--shift, 0px) - 9px);
    width: 18px; height: 9px;
    background: var(--pop-bg);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateX(calc(-50% + var(--shift, 0px))) scale(0.92) translateY(-6px); }
    to   { opacity: 1; transform: translateX(calc(-50% + var(--shift, 0px))) scale(1) translateY(0); }
  }
  .row { display: flex; align-items: center; gap: 9px; }
  .scanning { font-size: 12px; margin-bottom: 12px; }
  .spinner { width: 16px; height: 16px; animation: spin 0.9s steps(8) infinite; color: var(--pop-text); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mac-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: 13px; color: var(--pop-text);
    background: var(--btn-bg);
    border: 0.5px solid var(--btn-border);
    border-radius: 6px; padding: 3px 11px;
    box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.12);
  }
  .mac-btn[disabled] { opacity: 0.45; }
  .divider { height: 1px; background: var(--pop-divider); margin: 12px 0; }

  /* ---------- Hero copy ---------- */
  main {
    position: relative;
    height: 100dvh;
    display: flex; align-items: center;
    padding: calc(var(--bar-h) + 24px) clamp(16px, 7vw, 120px) 24px;
  }
  .copy { max-width: 440px; }
  .copy img { width: 76px; height: 76px; margin-bottom: 18px; border-radius: 18px; filter: drop-shadow(0 10px 24px rgba(0,0,0,.35)); }
  h1 { font-size: clamp(38px, 5vw, 60px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 750; }
  .tagline { margin-top: 14px; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.45; color: rgba(255,255,255,.82); }
  .download {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 28px; padding: 14px 24px;
    font-size: 17px; font-weight: 650; text-decoration: none;
    color: #12153a; background: #fff; border-radius: 999px;
    box-shadow: 0 12px 30px rgba(0,0,0,.28);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .download:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(0,0,0,.34); }
  .download:focus-visible { outline: 3px solid #ffb4b4; outline-offset: 3px; }
  .meta { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.6); }

  /* ---------- Small screens ---------- */
  /* ---------- Large screens: zoom the "desktop" so the app reads as the hero ---------- */
  .menubar { zoom: var(--z, 1); }
  main { --bar-h: calc(30px * var(--z, 1)); }
  @media (min-width: 1200px) and (min-height: 700px) { :root { --z: 1.3; } }
  @media (min-width: 1600px) and (min-height: 850px) { :root { --z: 1.5; } }

  @media (max-width: 900px) { .menubar .left .extra { display: none; } }
  @media (max-width: 720px) {
    main { align-items: flex-end; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
    .copy img { display: none; }
    .tagline { margin-top: 10px; }
    .download { margin-top: 20px; }
  }
  @media (max-width: 520px) {
    .menubar .left span:not(.app) { display: none; }
    .menubar .right .opt { display: none; }
    .popover { width: min(330px, calc(100vw - 32px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .popover, .spinner { animation: none; }
  }
</style>
</head>
<body>
  <header class="menubar" aria-hidden="true">
    <div class="left">
      <span class="app">Google Chrome</span>
      <span>File</span><span>Edit</span><span>View</span><span class="extra">History</span><span class="extra">Bookmarks</span><span class="extra">Profiles</span><span>Tab</span><span>Window</span><span>Help</span>
    </div>
    <div class="right">
      <div class="status-anchor">
        <div class="status-item"><div class="status-icon"></div></div>
        <div class="popover" id="popover">
          <div class="row scanning">
            <svg class="spinner" viewBox="0 0 16 16" aria-hidden="true">
              <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity="1"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".88" transform="rotate(-45 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".76" transform="rotate(-90 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".64" transform="rotate(-135 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".52" transform="rotate(-180 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".40" transform="rotate(-225 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".28" transform="rotate(-270 8 8)"/>
                <line x1="8" y1="1.5" x2="8" y2="4.5" opacity=".18" transform="rotate(-315 8 8)"/>
              </g>
            </svg>
            <span>Scanning for Menti QR...</span>
          </div>
          <button class="mac-btn" disabled tabindex="-1">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.07"/><path d="M13.5 2.5v3.2h-3.2"/></svg>
            Retry
          </button>
          <div class="divider"></div>
          <button class="mac-btn" tabindex="-1">Quit</button>
        </div>
      </div>
      <div class="opt">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="#fff"><path d="M9 13.2a1.7 1.7 0 1 0 0-3.4 1.7 1.7 0 0 0 0 3.4Z"/><path d="M9 6.1c1.8 0 3.4.7 4.6 1.9l-1.4 1.4A4.5 4.5 0 0 0 9 8.1c-1.2 0-2.4.5-3.2 1.3L4.4 8A6.5 6.5 0 0 1 9 6.1Z"/><path d="M9 2c2.9 0 5.6 1.2 7.5 3.1l-1.4 1.4A8.6 8.6 0 0 0 9 4a8.6 8.6 0 0 0-6.1 2.5L1.5 5.1A10.6 10.6 0 0 1 9 2Z"/></svg>
      </div>
      <div class="opt">
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".75" y=".75" width="22.5" height="11.5" rx="3.3" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/><rect x="2.6" y="2.6" width="15.5" height="7.8" rx="1.8" fill="#fff"/><path d="M25 4.4v4.2c.8-.3 1.3-1.1 1.3-2.1s-.5-1.8-1.3-2.1Z" fill="#fff" fill-opacity=".55"/></svg>
      </div>
      <div class="clock" id="clock">Tue 10 Nov 09:41</div>
    </div>
  </header>

  <main>
    <section class="copy">
      <img src="assets/app-icon.png" alt="" width="76" height="76">
      <h1>Menti Join</h1>
      <p class="tagline">Sits in your menu bar and joins the Menti on your screen in one click. No phone, no typing codes.</p>
      <a class="download" href="https://github.com/svallfors/menti-join-releases/releases/latest/download/Menti-Join.dmg">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10"/><path d="m5.5 8.8 4.5 4.5 4.5-4.5"/><path d="M4 17h12"/></svg>
        Download for Mac
      </a>
      <p class="meta">Free · macOS 15.5 or later · Signed and notarized</p>
    </section>
  </main>

<script>
  // Live menu bar clock
  const clock = document.getElementById('clock');
  function tick() {
    const d = new Date();
    const day = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '');
    const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    clock.textContent = day + '  ' + time;
  }
  tick(); setInterval(tick, 15000);

  // Keep the popover inside the viewport; the arrow stays on the icon (like macOS)
  const pop = document.getElementById('popover');
  function place() {
    pop.style.setProperty('--shift', '0px');
    // Work in the menu bar's own (unzoomed) units
    const z = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--z')) || 1;
    const anchor = pop.parentElement;
    const anchorLeft = anchor.getBoundingClientRect().left / z;
    const w = pop.offsetWidth, gutter = 12;
    const center = anchorLeft + anchor.offsetWidth / 2;
    let left = center - w / 2;
    const maxLeft = window.innerWidth / z - gutter - w;
    const shifted = Math.min(Math.max(left, gutter), maxLeft);
    pop.style.setProperty('--shift', (shifted - left) + 'px');
  }
  place(); addEventListener('resize', place);
</script>
</body>
</html>
